[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmda"
version = "0.1.0"
description = "Auditable pharmaceutical molecular-design campaign foundations"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.5", "psutil==7.2.2"]

[project.optional-dependencies]
chemistry = ["rdkit==2026.3.3"]
mcp = ["mcp>=1.28,<2"]
science = ["scikit-learn==1.9.0", "scipy==1.18.1", "polars==1.44.1"]
agents = ["requests>=2.32,<3"]
portal = ["fastapi==0.135.1", "uvicorn>=0.35,<1"]

[project.scripts]
pmda = "pmda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
